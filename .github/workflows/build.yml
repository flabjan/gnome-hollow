name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Java 25 installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle 9.5.1 installeren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Mod bouwen
        run: gradle build --stacktrace

      - name: Jar uploaden
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-hollow-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      # Alleen bij een fout: laat zien welke klassen GeckoLib echt bevat, zodat imports snel te corrigeren zijn.
      - name: Diagnose - GeckoLib-klassen
        if: failure()
        run: |
          find ~/.gradle -name 'geckolib*.jar' ! -name '*sources*' | while read j; do
            echo "== $j"
            unzip -l "$j" | grep -E '/(GeoEntity|PlayState|AnimationTest|GeckoLibUtil|AnimatableInstanceCache|GeoEntityRenderer|DefaultedEntityGeoModel|AnimationController|RawAnimation|AnimatableManager)\.class' || true
          done

      - name: Diagnose - rapporten uploaden
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-rapporten
          path: build/reports
          if-no-files-found: ignore
